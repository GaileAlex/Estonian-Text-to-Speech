# =================================================================
# 1. SERVER CONFIGURATION
# =================================================================
server.port=8380

spring.rabbitmq.host=${MQ_HOST:estonian-tts-rabbitmq-1}
spring.rabbitmq.port=${MQ_PORT:5672}

spring.rabbitmq.username=${MQ_USERNAME:guest}
spring.rabbitmq.password=${MQ_PASSWORD:guest}

# Synthesis of a long text (or the first request after the worker was idle) takes longer than the default 5s
spring.rabbitmq.template.reply-timeout=60s
# Return requests nobody can process (worker is down, unknown speaker) immediately instead of waiting for the timeout
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.publisher-returns=true

# Error responses as application/problem+json with the reason in "detail"
spring.mvc.problemdetails.enabled=true

# =================================================================
# 2. MONITORING (project observability)
# =================================================================
# Actuator has its own port, not published: Prometheus scrapes http://estonian-tts-spring-app-1:8081/actuator/prometheus
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=estonian-tts
# p95 of the synthesis in Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.maximum-expected-value.http.server.requests=120s
# [traceId-spanId] in the log lines: the traceId of the request of cv-app; no span leaves the application
management.tracing.sampling.probability=1.0

tts.exchange=text-to-speech
tts.volume=0.5
