## The TartuNLP worker (3.0.0, and 3.1.0 too) declares its queue non-durable and non-exclusive, with x-expires.
## RabbitMQ 4.3 denies such queues by default: without this line the worker cannot declare its queue
## and every request comes back as 503. When a RabbitMQ release removes the feature, the worker must change first.
deprecated_features.permit.transient_nonexcl_queues = true
