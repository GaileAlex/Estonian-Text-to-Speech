rabbitmq:
  host: ${MQ_HOST}
  username: ${MQ_USERNAME}
  password: ${MQ_PASSWORD}
  queues:
    in: "text-to-speech.multispeaker_d3ce4a45"
    out: "tts.out"

vocoders:
  vctk: models/hifigan/vctk # a directory with the .json and .pt files of the vocoder
  ljspeech: models/hifigan/ljspeech
tts_models:
  multispeaker:
    model_path: models/tts/multispeaker # a directory with the .yaml and .hdf5 files of the model
    frontend: 'est'
    speakers: # the speaker name (the last part of the routing key) -> its id in the model and its vocoder
      albert:
        speaker_id: 1
        vocoder: vctk
      indrek:
        speaker_id: 2
        vocoder: vctk
      kalev:
        speaker_id: 3
        vocoder: vctk
      kylli:
        speaker_id: 4
        vocoder: ljspeech
      liivika:
        speaker_id: 5
        vocoder: ljspeech
      mari:
        speaker_id: 6
        vocoder: ljspeech
      meelis:
        speaker_id: 7
        vocoder: vctk
      peeter:
        speaker_id: 8
        vocoder: vctk
      tambet:
        speaker_id: 9
        vocoder: vctk
      vesta:
        speaker_id: 10
        vocoder: vctk
