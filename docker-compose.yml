services:
  rabbitmq:
    # 3.x gets no fixes any more. The minor version is pinned: each minor may deny one more deprecated feature
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    restart: unless-stopped
    expose:
      - "5672"
      - "15672"
    # the worker's queue is a deprecated kind (see the file); guest/guest from the network is the default of the image
    volumes:
      - ./docker/rabbitmq/20-tts-worker.conf:/etc/rabbitmq/conf.d/20-tts-worker.conf:ro
    # the AMQP port opens as the last step of the boot. rabbitmqctl starts an Erlang VM of its own: 2 s of CPU
    # per check, a fifth of a core every 10 s for nothing
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5672"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kokoro-net

  tts-worker:
    build:
      context: ./docker/tts-worker
    command: --model-name multispeaker --model-config /app/config/config.yaml
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./docker/tts-worker/config.yaml:/app/config/config.yaml
    environment:
      - MQ_HOST=rabbitmq
      - MQ_USERNAME=guest
      - MQ_PASSWORD=guest
    networks:
      - kokoro-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  spring-app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    depends_on:
      - rabbitmq
    ports:
      - "127.0.0.1:8380:8380"
    environment:
      - MQ_HOST=rabbitmq
      - MQ_USERNAME=guest
      - MQ_PASSWORD=guest
    networks:
      - kokoro-net

networks:
  kokoro-net:
    external: true
